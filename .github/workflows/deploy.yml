name: Deploy Addons to GitHub Releases

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Create Individual Zips
        run: |
          mkdir release_assets
          cd Proyectos
          for proj in */; do
            proj_name=$(basename "$proj")
            cd "$proj"
            # Compress all addon files (lua, toc, xml, tga, md, etc.)
            zip -r "../../release_assets/${proj_name}.zip" . -x "changelog.md"
            cd ..
          done
          
      - name: Upload to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "latest"
          name: "Última Versión"
          files: release_assets/*.zip
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
