name: Deploy Addons to Google Drive

on:
  push:
    branches:
      - main
      - master

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Zip Addons
        run: |
          # Compress all addons into a single zip file, excluding Git folders
          zip -r WoW_Addons_Modificados.zip . -x "*.git*" -x ".github/*" -x "README.md"

      - name: Upload to Google Drive
        uses: adityak74/google-drive-upload-git-action@main
        with:
          credentials: ${{ secrets.GDRIVE_CREDENTIALS_DATA }}
          filename: "WoW_Addons_Modificados.zip"
          folderId: ${{ secrets.GDRIVE_FOLDER_ID }}
          overwrite: "true"
